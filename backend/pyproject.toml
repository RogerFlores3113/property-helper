[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "arq>=0.28",
    "asyncpg>=0.31",
    "fastapi>=0.136",
    "httpx>=0.28",
    "protego>=0.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.0",
    "selectolax>=0.4",
    "structlog>=25.5",
    "uvicorn[standard]>=0.46",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
